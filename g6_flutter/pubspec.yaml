name: g6_flutter
description: A powerful graph visualization framework for Flutter, ported from AntV G6
version: 0.1.0
homepage: https://github.com/antvis/G6

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core dependencies
  vector_math: ^2.1.4
  collection: ^1.18.0

  # Event handling
  event_bus: ^2.0.0

  # Animation
  flutter_animate: ^4.5.0

  # Utils
  uuid: ^4.0.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
